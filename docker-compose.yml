# ShopStream - TP de préparation au projet final Spark
# Démarrage :  docker compose up -d
# Producteur (après création du topic) :  docker compose up -d producer

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9094:9094"            # accès depuis la machine hôte : localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # le topic doit être créé à la main (Partie 1)

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shopstream
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    volumes:
      - pgdata:/var/lib/postgresql/data

  datagen:                     # s'exécute une seule fois : génère ./data/*.csv
    image: python:3.11-slim
    container_name: datagen
    working_dir: /app
    volumes:
      - ./datagen:/app
      - ./data:/data
    command: python generate_history.py

  producer:                    # flux temps réel -> Kafka (lancé explicitement)
    image: python:3.11-slim
    container_name: producer
    profiles: ["stream"]
    working_dir: /app
    depends_on: [kafka]
    volumes:
      - ./datagen:/app
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: reviews_stream
      RATE: "5"
      LATE_RATIO: "0.05"
    command: sh -c "pip install -q --disable-pip-version-check 'kafka-python>=2.0.2' && python -u producer.py"

  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    container_name: jupyter
    user: root
    ports:
      - "8888:8888"            # JupyterLab : http://localhost:8888/lab?token=shopstream
      - "4040-4045:4040-4045"  # Spark UI (une par SparkSession active)
    environment:
      JUPYTER_TOKEN: shopstream
      CHOWN_EXTRA: /home/jovyan/work
      CHOWN_EXTRA_OPTS: -R
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
    depends_on: [kafka, postgres, datagen]

volumes:
  pgdata:
